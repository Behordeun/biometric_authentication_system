groups:
  - name: auth_alerts
    rules:
      - alert: HighAuthFailureRate
        expr: rate(auth_failures_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High authentication failure rate"
          description: "This alert fires when the authentication failure rate exceeds 10 failures per 5 minutes, indicating potential issues with user logins or possible brute-force attempts."
