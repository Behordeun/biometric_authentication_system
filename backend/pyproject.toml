[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biometric-auth-backend"
version = "1.1.0"
description = "Hybrid Passwordless Authentication System Backend"
readme = "../README.md"
license = {text = "MIT"}
authors = [
    {name = "Muhammad Abiodun SULAIMAN", email = "abiodun.msulaiman@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
]
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    # Database
    "sqlalchemy==2.0.25",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    # Data Validation
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",
    "email-validator==2.1.1",
    # Authentication & Security
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "cryptography==44.0.1",
    "webauthn==2.0.0",
    # Cache
    "redis[hiredis]>=4.0.0",
    # HTTP Client
    "httpx==0.26.0",
    # Utilities
    "python-multipart==0.0.22",
    "python-dotenv==1.0.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.2.0",
    "setuptools>=80.9.0",
    "greenlet>=3.2.4",
    "mypy>=1.18.2",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",

    # Code Quality
    "black>=24.4.2",
    "isort>=5.13.3",
    "autoflake>=2.2.1",
    "mypy>=1.5.0",

    # Security
    "bandit>=1.7.5",
    "safety>=2.3.0",
]

[project.urls]
Homepage = "https://github.com/muhammad/biometric-authentication-system"
Documentation = "https://github.com/muhammad/biometric-authentication-system/docs"
Repository = "https://github.com/muhammad/biometric-authentication-system.git"
Issues = "https://github.com/muhammad/biometric-authentication-system/issues"

[project.scripts]
auth-server = "app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["app"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "webauthn.*",
    "aioredis.*",
    "passlib.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests", "migrations"]
skips = ["B101", "B601"]

[tool.uv]
