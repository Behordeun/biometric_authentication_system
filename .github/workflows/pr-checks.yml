name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check PR title
        run: |
          if ! echo "${{ github.event.pull_request.title }}" | grep -qE '^(feat|fix|docs|style|refactor|test|chore):'; then
            echo "PR title must start with: feat:, fix:, docs:, style:, refactor:, test:, or chore:"
            exit 1
          fi

      - name: Check PR description
        run: |
          if [ -z "${{ github.event.pull_request.body }}" ]; then
            echo "PR description cannot be empty"
            exit 1
          fi

      - name: Check for merge conflicts
        run: |
          git fetch origin ${{ github.base_ref }}
          # Calculate the merge base between HEAD and the base branch
          MERGE_BASE=$(git merge-base HEAD origin/${{ github.base_ref }})
          # Check for merge conflicts using git merge-tree
          if ! git merge-tree $MERGE_BASE HEAD origin/${{ github.base_ref }} | grep -q "^changed in both"; then
            echo "No merge conflicts detected"
          else
            echo "Merge conflicts detected"
            exit 1
          fi

  size-check:
    name: PR Size Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR size
        run: |
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | wc -l)
          DIFF_STAT=$(git diff --stat origin/${{ github.base_ref }}...HEAD | tail -1)
          if [[ -z "$DIFF_STAT" || "$DIFF_STAT" != *"changed"* ]]; then
            CHANGED_LINES=0
          else
            CHANGED_LINES=$(echo "$DIFF_STAT" | awk '{if ($4 ~ /^[0-9]+$/ && $6 ~ /^[0-9]+$/) print $4+$6; else print 0}')
          fi

          echo "Changed files: $CHANGED_FILES"
          echo "Changed lines: $CHANGED_LINES"

          if [ "$CHANGED_FILES" -gt 50 ]; then
            echo "::warning::PR changes more than 50 files. Consider splitting into smaller PRs."
          fi

          if [ "$CHANGED_LINES" -gt 1000 ]; then
            echo "::warning::PR changes more than 1000 lines. Consider splitting into smaller PRs."
          fi
