name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          POSTGRES_DB: testdb
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --requirepass ${{ secrets.TEST_REDIS_PASSWORD }}
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx

    - name: Run tests
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:${{ secrets.TEST_DB_PASSWORD }}@localhost:5432/testdb
        REDIS_URL: redis://:${{ secrets.TEST_REDIS_PASSWORD }}@localhost:6379
        SECRET_KEY: ${{ secrets.TEST_SECRET_KEY }}
        RP_ID: localhost
        RP_NAME: Test Auth System
        ORIGIN: http://localhost:3000
      run: |
        cd backend
        pytest
