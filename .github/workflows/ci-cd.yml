name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          pip install black isort autoflake

      - name: Check code formatting
        run: |
          cd backend
          black --check app/
          isort --check-only app/
          autoflake --check --remove-all-unused-imports -r app/

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run secret detection
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [lint, security]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ secrets.TEST_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.TEST_DB_NAME }}
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://${{ secrets.TEST_DB_USER }}:${{ secrets.TEST_DB_PASSWORD }}@localhost:5432/${{ secrets.TEST_DB_NAME }}
          REDIS_URL: ${{ secrets.TEST_REDIS_URL }}
          SECRET_KEY: ${{ secrets.TEST_SECRET_KEY }}
          RP_ID: localhost
          RP_NAME: Test Auth System
          ORIGIN: ${{ secrets.TEST_ORIGIN }}
          ENVIRONMENT: test
        run: |
          cd backend
          pytest --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          fail_ci_if_error: false

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: [lint, security]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run tests
        run: |
          cd frontend
          npm test -- --watchAll=false

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: auth-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.dev
          push: false
          tags: auth-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [docker-build]

    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: |
          # Ensure .env symlink exists
          if [ ! -L docker/.env ]; then
            ln -sf ../backend/.env docker/.env
          fi
          cd docker
          docker-compose up -d
          for i in {1..30}; do
            if curl -f http://localhost:8000/health; then
              break
            fi
            sleep 1
          done

      - name: Check service health
        run: |
          if ! curl -f http://localhost:8000/health; then
            echo "Service health check failed"
            exit 1
          fi

      - name: Run integration tests
        run: |
          set -e
          response=$(curl -s -w "%{http_code}" -o result.json -X POST http://localhost:8000/auth/register/options \
            -H "Content-Type: application/json" \
            -d '{"email":"test@example.com","username":"testuser"}')
          if [ "$response" -ne 200 ]; then
            echo "Integration test failed with HTTP status $response"
            cat result.json
            exit 1
          fi
          echo "Integration test passed"

      - name: Stop services
        if: always()
        run: |
          cd docker
          docker-compose down -v

  all-checks-passed:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint, security, test-backend, test-frontend, docker-build, integration-test]
    if: always()

    steps:
      - name: Check all jobs
        run: |
          lint_result="${{ needs.lint.result }}"
          security_result="${{ needs.security.result }}"
          backend_result="${{ needs.test-backend.result }}"
          frontend_result="${{ needs.test-frontend.result }}"
          docker_result="${{ needs.docker-build.result }}"
          integration_result="${{ needs.integration-test.result }}"

          if [ "$lint_result" != "success" ] || \
             [ "$security_result" != "success" ] || \
             [ "$backend_result" != "success" ] || \
             [ "$frontend_result" != "success" ] || \
             [ "$docker_result" != "success" ] || \
             [ "$integration_result" != "success" ]; then
            echo "One or more checks failed"
            exit 1
          fi
          echo "All checks passed successfully!"
